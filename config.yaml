# Personal AI Research Assistant — config
#
# API keys are loaded from environment variables (see .env.example):
#   ANTHROPIC_API_KEY, OPENAI_API_KEY, OPENROUTER_API_KEY, EXA_API_KEY, TAVILY_API_KEY
# Ollama base URL defaults to http://localhost:11434 (override with OLLAMA_BASE_URL).

llm:
  # Per-role provider/model mapping. Any role may use any provider.
  # Providers: anthropic | openai | openrouter | ollama | local
  # OpenRouter accepts any supported catalog slug, for example:
  #   qa:       { provider: openrouter, model: anthropic/claude-sonnet-4.6 }
  #   citation_verifier: { provider: openrouter, model: anthropic/claude-sonnet-4.6 }
  #   conversation_title: { provider: openrouter, model: anthropic/claude-haiku-4.5 }
  #   embedder: { provider: openrouter, model: openai/text-embedding-3-small }
  roles:
    orchestrator:  { provider: ollama, model: qwen2.5:3b }
    qa:            { provider: ollama, model: qwen2.5:3b }
    citation_verifier: { provider: ollama, model: qwen2.5:3b }
    conversation_title: { provider: ollama, model: qwen2.5:3b }
    retrieval:     { provider: ollama, model: qwen2.5:3b }
    curator_judge: { provider: ollama, model: qwen2.5:3b }
    summarizer:    { provider: ollama, model: qwen2.5:3b }
    criteria:      { provider: ollama, model: qwen2.5:3b }
    info_gatherer: { provider: ollama, model: qwen2.5:3b }
    embedder:      { provider: ollama, model: nomic-embed-text }
    # Reranking does not support Ollama; without sentence-transformers it falls back to hybrid order.
    reranker:      { provider: local, model: cross-encoder/ms-marco-MiniLM-L6-v2 }

rag:
  mode: vanilla          # vanilla | agentic
  top_k: 8
  history_turns: 4
  hybrid:
    dense_weight: 0.7
    sparse_weight: 0.3
  agentic:
    max_iters: 3
  graph:
    enabled: true         # expand hybrid results via explicit arXiv citation links
    max_neighbors: 6
    graph_slots: 2        # at most this many of the final top_k come from graph neighbors
  query_rewrite:
    enabled: true
    first_turn: true     # extra model call to expand terse standalone questions
    max_chars: 300
  compression:
    enabled: true
    max_chars_per_chunk: 400
    max_total_chars: 3200

domains:
  # Example:
  - name: rag
    arxiv_categories: [cs.CL, cs.IR]
    venues: [ACL, EMNLP, NeurIPS]
    seed_papers: []

mcp:
  servers: []
  # Example:
  # - name: arxiv
  #   transport: stdio
  #   command: ["uvx", "arxiv-mcp-server"]
  # - name: web_search
  #   transport: stdio
  #   command: ["uvx", "exa-mcp-server"]

storage:
  qdrant_path: ./data/qdrant
  sqlite_path: ./data/assistant.db
  pdf_dir:     ./data/pdfs

curation:
  accept_threshold: 0.65   # LLM-judge score [0,1] above which a paper is ingested

monitor:
  enabled: false
  interval_minutes: 360

concurrency:
  background_workers: 2  # parallel ingest/monitor jobs; keep modest with local Ollama
