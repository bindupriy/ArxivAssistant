[project]
name = "assistant"
version = "0.1.0"
description = "Personal AI research assistant: tracks domains, curates papers, answers questions."
requires-python = ">=3.10"
dependencies = [
    # Orchestration
    "langgraph>=0.2.50",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain>=0.3.7",
    "langchain-core>=0.3.15",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.2.10",
    "langchain-ollama>=0.2.0",
    "langchain-mcp-adapters>=0.0.3",
    # RAG / vector
    "qdrant-client>=1.12.0",
    "rank-bm25>=0.2.2",
    # Document parsing (Marker is heavy; install in Phase 3 if needed)
    "pymupdf>=1.24.0",
    # MCP
    "mcp>=1.0.0",
    # Storage
    "sqlalchemy>=2.0.36",
    # Scheduling
    "apscheduler>=3.10.4",
    # CLI / config
    "typer>=0.13.0",
    "rich>=13.9.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    # arxiv fetch fallback (when MCP isn't wired)
    "arxiv>=2.1.3",
    "httpx>=0.27.0",
    # Local web UI
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.12",
]

[project.scripts]
assistant = "assistant.cli:app"

[project.optional-dependencies]
streamlit = ["streamlit>=1.40,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assistant"]

[tool.ruff]
line-length = 100
target-version = "py310"
